name: build-dev
on:
  push:
    branches:
      - main
jobs:
  build-and-publish-dev:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image
        run: docker build --tag ghcr.io/luceoon/rmm:dev --label "org.opencontainers.image.source=https://github.com/Luceoon/RateMeMeow" --file RMM/Dockerfile .
      - name: Push Docker Image
        run: docker push ghcr.io/luceoon/rmm:dev