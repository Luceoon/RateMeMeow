name: build-release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build-and-publish-release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image
        run: |
          docker build \
            --tag ghcr.io/luceoon/rmm:latest \
            --tag ghcr.io/luceoon/rmm:${{ steps.get_version.outputs.VERSION }} \
            --build-arg APP_VERSION=${{ steps.get_version.outputs.VERSION }} \
            --label "org.opencontainers.image.source=https://github.com/Luceoon/RateMeMeow" \
            --file RMM/Dockerfile .
      - name: Push Docker Image
        run: |
          docker push ghcr.io/luceoon/rmm:latest
          docker push ghcr.io/luceoon/rmm:${{ steps.get_version.outputs.VERSION }}